<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Emotion Detector</title>
	<style>
		:root {
			color-scheme: light;
			font-family: Arial, sans-serif;
			background: #eef4f8;
			color: #17324d;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
		}

		main {
			width: min(92%, 640px);
			padding: 2rem;
			background: white;
			border: 1px solid #d7e2ea;
			border-radius: 12px;
			box-shadow: 0 12px 30px rgba(23, 50, 77, 0.12);
		}

		h1 { margin-top: 0; }
		label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
		textarea {
			width: 100%;
			min-height: 130px;
			box-sizing: border-box;
			padding: 0.8rem;
			border: 1px solid #b8cbd8;
			border-radius: 6px;
			font: inherit;
			resize: vertical;
		}

		button {
			margin-top: 1rem;
			padding: 0.75rem 1.2rem;
			border: 0;
			border-radius: 6px;
			background: #176b87;
			color: white;
			font: inherit;
			font-weight: bold;
			cursor: pointer;
		}

		button:disabled { opacity: 0.65; cursor: wait; }
		#result { margin-top: 1.5rem; line-height: 1.6; }
	</style>
</head>
<body>
	<main>
		<h1>Emotion Detector</h1>
		<p>Enter a sentence to analyze its emotional tone.</p>
		<form id="emotion-form">
			<label for="textToAnalyze">Text to analyze</label>
			<textarea id="textToAnalyze" name="textToAnalyze" required placeholder="I am very happy today!"></textarea>
			<button type="submit">Analyze emotion</button>
		</form>
		<p id="result" role="status"></p>
	</main>
	<script>
		const form = document.getElementById('emotion-form');
		const result = document.getElementById('result');

		form.addEventListener('submit', async (event) => {
			event.preventDefault();
			const button = form.querySelector('button');
			button.disabled = true;
			result.textContent = 'Analyzing...';

			try {
				const text = document.getElementById('textToAnalyze').value;
				const response = await fetch(`/emotionDetector?textToAnalyze=${encodeURIComponent(text)}`);
				result.textContent = await response.text();
			} catch (error) {
				result.textContent = 'Unable to contact the server.';
			} finally {
				button.disabled = false;
			}
		});
	</script>
</body>
</html>
